<style>
body{margin:0;background:black;color:#39ff14;font-family:Orbitron;overflow:hidden}
canvas#bg{position:fixed;top:0;left:0;z-index:-1}
.orbit{position:absolute;top:50%;left:50%;width:420px;height:420px;transform:translate(-50%,-50%)}
.node{position:absolute;width:70px;height:70px;border-radius:50%;border:1px solid #39ff14;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.6)}
.goddess{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#0f0,#010);margin:auto}
.section{display:none}
.section.active{display:block}
</style>

</head>

<body>

<div class="goddess" id="avatar"></div>

<div id="homeSection" class="section active"></div>
<div id="storeSection" class="section"></div>
<div id="aiSection" class="section"></div>
<div id="designSection" class="section"></div>

<div class="orbit" id="orbit"></div>

<div id="log"></div>

<script>

const logBox=document.getElementById("log");

function log(m){
if(!logBox)return;
logBox.innerHTML+=m+"<br>";
logBox.scrollTop=logBox.scrollHeight;
}

const routes={
"/ai":"aiSection",
"/store.html":"storeSection",
"/design":"designSection",
"/home":"homeSection"
};

function navigate(route){
Object.values(routes).forEach(id=>{
const el=document.getElementById(id);
if(el)el.classList.remove("active");
});
const target=routes[route];
if(target){
const el=document.getElementById(target);
if(el)el.classList.add("active");
}
window.history.pushState({},route,route);
}

function route(mode){
log("route "+mode);
fetch("/api/agent",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({input:mode})
}).catch(()=>{});
if(routes["/"+mode.toLowerCase()]){
navigate("/"+mode.toLowerCase());
}
}

const nodes=[
{icon:"fa-brain",mode:"AI"},
{icon:"fa-store",mode:"Store"},
{icon:"fa-palette",mode:"Design"},
{icon:"fa-home",mode:"Home"},
{icon:"fa-users",mode:"Community"},
{icon:"fa-seedling",mode:"Grow"}
];

const orbit=document.getElementById("orbit");

nodes.forEach((n,i)=>{
const el=document.createElement("div");
el.className="node";
el.innerHTML=`<i class="fa-solid ${n.icon}"></i>`;
const angle=(i/nodes.length)*Math.PI*2;
const r=170;
el.style.left=`calc(50% + ${Math.cos(angle)*r}px - 35px)`;
el.style.top=`calc(50% + ${Math.sin(angle)*r}px - 35px)`;
el.onclick=()=>route(n.mode);
orbit.appendChild(el);
});

addEventListener("popstate",()=>{
navigate(location.pathname);
});

</script>

</body>
