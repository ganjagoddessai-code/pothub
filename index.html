  <input id="emailCapture" placeholder="Join AI Updates" style="width:100%;margin-top:5px;">
  <button onclick="captureEmail()" style="width:100%;margin-top:5px;">Join</button>
</div>

<div id="exit-popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:black; border:1px solid #39ff14; padding:20px; z-index:10000; text-align:center; font-family:Rajdhani;">
  <h3>🚀 Before You Go...</h3>
  <p>Join early access to the AI system</p>
  <input id="exitEmail" placeholder="Enter email" style="width:100%;margin-top:5px;">
  <button onclick="captureExitEmail()" style="width:100%;margin-top:5px;">Join</button>
</div>

<script>         
window.onerror=(m)=>console.log("Error:",m);         
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(()=>{})})}         

const orbit = document.getElementById("orbit");         
const nodes = [         
  {icon:'fa-brain',mode:'AI Assistant'},         
  {icon:'fa-seedling',mode:'Grow'},         
  {icon:'fa-store',mode:'Store'},         
  {icon:'fa-palette',mode:'Design Studio'},         
  {icon:'fa-tags',mode:'Deals'},         
  {icon:'fa-truck',mode:'Logistics'},         
  {icon:'fa-dna',mode:'Genetics'},         
  {icon:'fa-calendar',mode:'Sessions'},         
  {icon:'fa-users',mode:'Community'}         
];         

nodes.forEach((n,i)=>{         
  const el=document.createElement("div");         
  el.className="node";         
  el.innerHTML=`<i class="fa-solid ${n.icon}"></i>`;         
  const angle=(i/nodes.length)*(Math.PI*2);         
  const r=orbit.offsetWidth/2 || 150;         
  const x=Math.cos(angle)*r;         
  const y=Math.sin(angle)*r;         
  el.style.left=`calc(50% + ${x}px - 35px)`;         
  el.style.top=`calc(50% + ${y}px - 35px)`;         
  el.onclick=()=>route(n.mode);         
  orbit.appendChild(el);         
});         

const log=(msg)=>{const el=document.getElementById("log");if(el){el.innerHTML+=msg+"<br>";el.scrollTop=el.scrollHeight;}}         

function send(){
  const msg=document.getElementById("msg").value;
  log("> "+msg);
  fetch("http://localhost:3000/api/agent",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({input:msg})
  })
  .then(r=>r.json())
  .then(d=>{ log("AI: "+d.response); alert(d.response); })
  .catch(e=>log("Fetch error connection local server."));
}         

function route(mode){
  log("Route: "+mode);
  fetch("http://localhost:3000/api/agent",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({input:mode})
  })
  .then(r=>r.json())
  .then(d=>{ log("AI: "+d.response); alert(d.response); })
  .catch(e=>log("Navigation updated target route: " + mode));
}         

function voiceInput(){
  const SpeechComp = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechComp) return alert("Speech recognition not supported in this browser.");
  const rec=new SpeechComp();
  rec.onresult=e=>{document.getElementById("msg").value=e.results[0][0].transcript;send();};
  rec.start();
}         

const sound=new Howl({src:["https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"]});         
document.addEventListener("click",e=>{if(e.target.closest(".node"))sound.play();});         

const canvas=document.getElementById("bg");         
const ctx=canvas.getContext("2d");         
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}         
window.addEventListener("resize",resize,{passive:true});resize();         
let stars=Array.from({length:120},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2}));         
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#39ff14";stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();s.y+=0.2;if(s.y>canvas.height)s.y=0;});requestAnimationFrame(draw);}         
draw();        

function captureEmail(){
  const email = document.getElementById("emailCapture").value;
  if(!email) return alert("Enter email");
  localStorage.setItem("ggai_email", email);
  log("Email captured: " + email);
  alert("Early access secured 🚀");
}

document.addEventListener("mouseleave", function(e){
  if(e.clientY < 10){
    const popup = document.getElementById("exit-popup");
    if(popup) popup.style.display = "block";
  }
});

function captureExitEmail(){
  const email = document.getElementById("exitEmail").value;
  if(!email) return alert("Enter email");
  localStorage.setItem("ggai_exit_email", email);
  log("Exit email: " + email);
  alert("Confirmed! 🚀");
  document.getElementById("exit-popup").style.display = "none";
}

(function trackUser(){
  const session = Date.now();
  localStorage.setItem("ggai_session", session);
  log("Session started: " + session);
})();

setInterval(()=>{
  const panel = document.getElementById("monetize-panel");
  if(panel && panel.style.display === "block"){
    panel.style.boxShadow = "0 0 25px #39ff14";
    setTimeout(()=>panel.style.boxShadow="",500);
  }
},10000);

(function domainBehavior(){
  const host = window.location.hostname;
  log("Domain detected: " + host);
  if(host.includes(".store")){
    const panel = document.getElementById("monetize-panel");
    if(panel){ panel.style.display = "block"; panel.style.border = "2px solid #39ff14"; }
    log("🛒 Store mode activated");
  }
  if(host.includes(".online")){
    setTimeout(()=>{
      const emailInput = document.getElementById("emailCapture");
      if(emailInput){ emailInput.focus(); }
      alert("🚀 Join the AI beta experience");
    },1000);
    log("🚀 Funnel mode activated");
  }
  if(host.includes(".org")){ log("📚 Knowledge mode activated"); }
  if(host.includes(".com")){ log("🌐 Main experience mode"); }
})();
</script>
